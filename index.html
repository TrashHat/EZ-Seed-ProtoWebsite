<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home-body">

  <!-- Decorative blobs -->
  <div class="blob blob-tl"></div>
  <div class="blob blob-tr"></div>
  <div class="blob blob-bl"></div>
  <div class="blob blob-br"></div>

  <!-- Top bar -->
  <div class="home-topbar">
    <span class="home-topbar-text">Welcome, Farmer!</span>
    <div class="home-topbar-avatar"></div>
  </div>

  <!-- Main content -->
  <main class="home-center">
    <img
      src="assets/ezseed header.png"
      alt="EZ-SEED"
      class="home-logo"
    >
    <p class="home-logo-sub">Farmer-Centered Rice Seed Selection Made Easy</p>
    <p class="home-tagline">Your seed, your choice.</p>

    <div class="home-bento">
      <a href="seedselect.html" class="bento-card">
        <img src="assets/order seed.png" alt="Request Seeds">
        <span>Request Seeds</span>
      </a>
      <a href="trackrequests.html" class="bento-card">
        <img src="assets/track request.png" alt="Track Request">
        <span>Track Request</span>
      </a>
      <a href="viewprofile.html" class="bento-card bento-card-wide">
        <img src="assets/view profile.png" alt="View Profile">
        <span>View Profile</span>
      </a>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
