<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Log In</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">

  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/ez-seed-logo.png" alt="EZ-Seed" class="login-logo">
      <h1 class="login-title">EZ-Seed</h1>
      <p class="login-sub">Log in to continue</p>

      <form id="login-form">
        <p id="login-error" class="login-error">Invalid username or password.</p>
        <input id="login-user" class="login-field" type="text"     placeholder="Username" autocomplete="username"     required>
        <input id="login-pass" class="login-field" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="btn-login">Log In</button>
      </form>
      <p class="login-hint">Farmers: FarmerA or FarmerB &nbsp;|&nbsp; DA: DAOfficer or DABoard</p>
      <button id="reset-all-btn" class="btn-reset-all">Reset All Data</button>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
