<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — View Profile</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-left">
      <a href="index.html" class="navbar-home">&#8592; Home</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, Farmer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <div class="profile-layout">
      <div class="profile-photo"></div>

      <div class="profile-info">
        <p class="profile-name">[NAME OF FARMER]'s Profile</p>
        <div class="profile-fields">
          <div>[Full Name]</div>
          <div>[Location]</div>
          <div>[Contact Number]</div>
          <div>[Number of hectares of farm]</div>
        </div>
        <button class="btn btn-primary profile-edit-btn">Edit Profile</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
