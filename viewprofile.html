<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — View Profile</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="farmer-profile">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="dashboard.html" class="navbar-home">&#8592; Home</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, Farmer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <div class="profile-v2">
      <div class="profile-photo-v2"></div>
      <div class="profile-info-v2">
        <p class="profile-name-v2">[NAME OF FARMER]'s Profile</p>
        <div class="profile-fields-v2">
          <div>[Full Name]</div>
          <div>[Location]</div>
          <div>[Contact Number]</div>
          <div>[Number of hectares of farm]</div>
        </div>

        <div class="verified-row">
          <input type="checkbox" id="verified-checkbox" class="verified-checkbox">
          <label class="verified-label" for="verified-checkbox">Verified</label>
          <span id="verified-status" style="font-size:0.85rem; color:#666;"></span>
        </div>

        <button id="register-btn" class="btn btn-primary register-btn">Register</button>
        <button id="reset-my-data-btn" class="btn btn-reset-farmer">Reset My Data</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
