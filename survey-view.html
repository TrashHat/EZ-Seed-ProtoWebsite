<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Your Request Summary</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body data-page="survey-view">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="dashboard.html" class="navbar-home">&#8592; Home</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, Farmer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-title">Summary of Preference Survey</h1>

    <div id="summary-list" class="seed-list-v2"></div>

    <div class="detail-status-row" style="margin-top:1.25rem;">
      <span class="detail-status-label">Status of Request:</span>
      <span id="survey-status-badge"></span>
    </div>

    <div id="survey-allocated" class="seed-list-v2" style="margin-top:0.75rem; display:none;"></div>

    <div class="survey-results-header">
      <h2 class="survey-results-title">Ongoing Seed Survey Results</h2>
      <button class="btn-toggle-charts" id="toggle-charts-btn">Hide Charts</button>
    </div>

    <div id="hidden-charts-bar" style="display:none;"></div>

    <div id="survey-charts-section">
      <div class="da-charts-row">
        <div class="da-chart-wrap">
          <p class="da-chart-title">Inbred Varieties</p>
          <canvas id="chart-sv-inbred"></canvas>
        </div>
        <div class="da-chart-wrap">
          <p class="da-chart-title">Hybrid Varieties</p>
          <canvas id="chart-sv-hybrid"></canvas>
        </div>
        <div class="da-chart-wrap">
          <p class="da-chart-title">All Varieties</p>
          <canvas id="chart-sv-all"></canvas>
        </div>
        <div class="da-chart-wrap">
          <p class="da-chart-title">Most Common Pairs</p>
          <canvas id="chart-sv-pairs"></canvas>
        </div>
      </div>
    </div>

    <div class="next-area" style="margin-top:2rem;">
      <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>

  <!-- Seed Info Modal -->
  <div class="modal-overlay" id="seed-modal">
    <div class="modal-panel">
      <button class="modal-close" id="modal-close">&#x2715;</button>
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-desc"  id="modal-desc"></p>
        <div class="modal-badges" id="modal-badges"></div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
