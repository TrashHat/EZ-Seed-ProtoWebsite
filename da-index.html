<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — DA Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="da-home" class="home-v2">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="index.html" class="navbar-home">&#8592; Log Out</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, DAOfficer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="home-center-v2">
    <img src="assets/ez-seed-logo.png" alt="EZ-Seed" class="home-logo-v2">
    <h1 class="home-title-v2">EZ-Seed</h1>
    <p class="home-sub-v2">DA Officer Dashboard</p>

    <div class="bento-grid-v2">
      <a href="da-survey.html" class="bento-card-v2">
        <img src="assets/order seed.png" alt="Seed Survey">
        <span>Seed Survey</span>
      </a>
      <a href="da-trackrequests.html" class="bento-card-v2">
        <img src="assets/track request.png" alt="Track Requests">
        <span>Track Requests</span>
      </a>
      <a href="da-registrations.html?tab=pending" class="bento-card-v2" data-card="da-registrations">
        <img src="assets/view profile.png" alt="Pending Registrations">
        <span>Pending Registrations</span>
        <span class="bento-badge" id="reg-pending-badge" style="display:none"></span>
      </a>
      <a href="da-registrations.html?tab=registered" class="bento-card-v2">
        <img src="assets/view profile.png" alt="Registered Farmers">
        <span>Registered Farmers</span>
      </a>
      <a href="da-previoussurveys.html" class="bento-card-v2">
        <img src="assets/order seed.png" alt="Previous Surveys">
        <span>Previous Surveys</span>
      </a>
      <a href="da-viewprofile.html" class="bento-card-v2">
        <img src="assets/view profile.png" alt="View Profile">
        <span>View Profile</span>
      </a>
    </div>
  </div>

  <div class="home-footer-v2"></div>

  <script src="js/main.js"></script>
</body>
</html>
