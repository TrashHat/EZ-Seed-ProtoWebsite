<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="farmer-home" class="home-v2">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="index.html" class="navbar-home">&#8592; Log Out</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, Farmer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="home-center-v2">
    <img src="assets/ez-seed-logo.png" alt="EZ-Seed" class="home-logo-v2">
    <h1 class="home-title-v2">EZ-Seed</h1>
    <p class="home-sub-v2">Your seed, your choice.</p>

    <div class="bento-grid-v2">
      <a href="seedselect-inbred.html" class="bento-card-v2" data-requires-verified data-card="request-seeds">
        <img src="assets/order seed.png" alt="Request Seeds">
        <span>Request Seeds</span>
      </a>
      <a href="trackrequests.html" class="bento-card-v2" data-requires-verified>
        <img src="assets/track request.png" alt="Track Orders">
        <span>Track Orders</span>
      </a>
      <a href="viewprofile.html" class="bento-card-v2">
        <img src="assets/view profile.png" alt="View Profile">
        <span>View Profile</span>
      </a>
      <a href="seedorder.html" class="bento-card-v2" data-requires-verified data-card="order-seeds">
        <img src="assets/track request.png" alt="Order Seeds">
        <span>Order Seeds</span>
      </a>
    </div>
  </div>

  <div class="home-footer-v2"></div>

  <script src="js/main.js"></script>
</body>
</html>
