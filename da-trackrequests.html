<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Track Farmer Requests</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="da-trackrequests">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="da-index.html" class="navbar-home">&#8592; Dashboard</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, DAOfficer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-title">Farmer Seed Orders</h1>

    <!-- 5 dropdown filters in dark container -->
    <div class="da-filter-bar">
      <select class="da-filter-select" disabled title="Not available in prototype">
        <option>All Provinces</option>
      </select>
      <select class="da-filter-select" disabled title="Not available in prototype">
        <option>All Municipalities</option>
      </select>
      <select id="da-status-filter" class="da-filter-select">
        <option value="all">All Statuses</option>
        <option value="decision_pending">Decision Pending</option>
        <option value="decision_made">Decision Made</option>
        <option value="shipping_pao">Shipping to PAO</option>
        <option value="arrived_pao">Arrived at PAO</option>
        <option value="for_pickup">For Pick-Up</option>
        <option value="delivered">Delivered</option>
      </select>
      <select id="da-season-filter" class="da-filter-select">
        <option value="all">All Seasons</option>
      </select>
      <select class="da-filter-select" disabled title="Not available in prototype">
        <option>All Time</option>
      </select>
    </div>

    <div id="da-orders-list" class="request-list orders-list-v2"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
