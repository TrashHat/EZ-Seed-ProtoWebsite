<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Order Seeds</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="seed-order">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="dashboard.html" class="navbar-home">&#8592; Home</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, Farmer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-title">Select your preferred seed variety.</h1>

    <div style="text-align:center; margin-bottom:1.25rem;">
      <span class="budget-pill" id="budget-display">Number of Allotted Sacks Left: 20</span>
    </div>

    <div id="seed-order-rows-container" class="seed-order-rows"></div>

    <div class="next-area">
      <button id="add-btn" class="btn btn-primary" disabled>Add to Order</button>
    </div>

    <div class="legend">
      <p class="legend-title">Legend</p>
      <div class="legend-items">
        <span class="legend-item"><span class="star star-mao">★</span> MAO Recommendation</span>
        <span class="legend-item"><span class="star star-pao">★</span> PAO Recommendation</span>
        <span class="legend-item"><span class="star star-board">★</span> Board Recommendation</span>
        <span class="legend-item"><span class="badge badge-your-pick">✓ Your Pick</span> Your survey choice</span>
      </div>
    </div>
  </div>

  <!-- Seed Info Modal -->
  <div class="modal-overlay" id="seed-modal">
    <div class="modal-panel">
      <button class="modal-close" id="modal-close">&#x2715;</button>
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-desc"  id="modal-desc"></p>
        <div class="modal-badges" id="modal-badges"></div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
