<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Summary of Seed Recommendations</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="board-summary">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="board-board.html" class="navbar-home">&#8592; Back</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, DABoard!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-title">Summary of Seed Recommendations</h1>

    <div id="board-summary-list" class="seed-list-v2"></div>

    <div class="legend">
      <p class="legend-title">Legend</p>
      <div class="legend-items">
        <span class="legend-item"><span class="star star-mao">★</span> MAO Recommendation</span>
        <span class="legend-item"><span class="star star-pao">★</span> PAO Recommendation</span>
        <span class="legend-item"><span class="star star-board">★</span> Board Recommendation</span>
      </div>
    </div>

    <p style="text-align:center; margin-top:1.5rem; color:var(--text-dark);">Is this recommendation correct?</p>

    <div class="btn-row-v2">
      <button id="back-btn"    class="btn btn-secondary">Back to Selection</button>
      <button id="confirm-btn" class="btn btn-primary">Confirm Recommendation</button>
    </div>
  </div>

  <!-- Seed Info Modal -->
  <div class="modal-overlay" id="seed-modal">
    <div class="modal-panel">
      <button class="modal-close" id="modal-close">&#x2715;</button>
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-desc"  id="modal-desc"></p>
        <div class="modal-badges" id="modal-badges"></div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
