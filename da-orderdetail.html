<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Order Detail</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="da-orderdetail">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="da-trackrequests.html" class="navbar-home">&#8592; Back</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, DAOfficer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-title" id="detail-season"></h1>

    <!-- Farmer info -->
    <div class="da-order-info">
      <div class="da-order-info-row">
        <span class="da-order-info-label">Farmer Name</span>
        <span class="da-order-info-value" id="info-farmer"></span>
      </div>
      <div class="da-order-info-row">
        <span class="da-order-info-label">Location</span>
        <span class="da-order-info-value" id="info-location"></span>
      </div>
      <div class="da-order-info-row">
        <span class="da-order-info-label">Season</span>
        <span class="da-order-info-value" id="info-season"></span>
      </div>
      <div class="da-order-info-row">
        <span class="da-order-info-label">Year</span>
        <span class="da-order-info-value" id="info-year"></span>
      </div>
    </div>

    <div id="detail-list" class="seed-list-v2"></div>

    <div class="detail-status-row">
      <span class="detail-status-label">Status of Request:</span>
      <span id="detail-status"></span>
    </div>

    <div class="btn-row-v2" style="margin-top:1.5rem;">
      <button id="da-update-status-btn" class="btn btn-primary"></button>
      <a href="da-trackrequests.html" class="btn btn-secondary">Back to Orders</a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
