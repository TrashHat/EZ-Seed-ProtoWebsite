<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Order Detail</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="da-orderdetail">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="da-trackrequests.html" class="navbar-home">&#8592; Back</a>
    </div>
    <div class="navbar-right">
      <span class="navbar-greeting">Welcome, DAOfficer!</span>
      <div class="navbar-avatar"></div>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-title" id="detail-season"></h1>

    <!-- Farmer info -->
    <div class="da-order-info">
      <div class="da-order-info-row">
        <span class="da-order-info-label">Farmer Name</span>
        <span class="da-order-info-value" id="info-farmer"></span>
      </div>
      <div class="da-order-info-row">
        <span class="da-order-info-label">Location</span>
        <span class="da-order-info-value" id="info-location"></span>
      </div>
      <div class="da-order-info-row">
        <span class="da-order-info-label">Season</span>
        <span class="da-order-info-value" id="info-season"></span>
      </div>
      <div class="da-order-info-row">
        <span class="da-order-info-label">Year</span>
        <span class="da-order-info-value" id="info-year"></span>
      </div>
    </div>

    <h2 class="da-section-title" style="margin-top:1.25rem;">Farmer's Seed Preference</h2>
    <div id="farmer-pref-list" class="seed-list-v2"></div>

    <h2 class="da-section-title" style="margin-top:1.25rem;">Allocated Seed</h2>
    <div id="detail-list" class="seed-list-v2"></div>

    <div class="detail-status-row">
      <span class="detail-status-label">Status of Request:</span>
      <span id="detail-status"></span>
    </div>

    <!-- Farmer change request callout -->
    <div id="farmer-feedback-callout" class="feedback-callout" style="display:none;">
      <div class="feedback-callout-title">&#9888; Change Request from Farmer</div>
      <div class="da-order-info" style="margin-top:0.35rem;">
        <div class="da-order-info-row">
          <span class="da-order-info-label">Reason</span>
          <span id="feedback-reason-text" class="da-order-info-value"></span>
        </div>
        <div class="da-order-info-row">
          <span class="da-order-info-label">Message</span>
          <span id="feedback-message-text" class="da-order-info-value"></span>
        </div>
      </div>
    </div>

    <!-- Decision / Change Allocation form -->
    <div id="decision-form" style="display:none; margin-top:1.5rem;">
      <h2 class="da-section-title">Make Allocation Decision</h2>
      <div class="da-order-info">
        <div class="da-order-info-row">
          <span class="da-order-info-label">Seed Type</span>
          <select id="decision-seed" class="da-select" style="flex:1;"></select>
        </div>
        <div class="da-order-info-row">
          <span class="da-order-info-label">Allotment (sacks)</span>
          <input id="decision-allotment" type="number" min="1" value="20"
            style="flex:1; padding:0.4rem 0.75rem; border:1.5px solid #ccc; border-radius:var(--radius); font-size:0.9rem; font-family:inherit;">
        </div>
      </div>
      <div class="next-area" style="margin-top:1rem;">
        <button id="decision-confirm-btn" class="btn btn-primary">Confirm Decision</button>
      </div>
    </div>

    <div class="btn-row-v2" style="margin-top:1.5rem;">
      <button id="da-update-status-btn" class="btn btn-primary" style="display:none;"></button>
      <a href="da-trackrequests.html" class="btn btn-secondary">Back to Orders</a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
