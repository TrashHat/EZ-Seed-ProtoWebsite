<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ-Seed — Seed Detail</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="seeddetail">

  <nav class="navbar">
    <span class="navbar-greeting">Welcome, Farmer!</span>
    <div class="navbar-avatar"></div>
  </nav>

  <div class="page">
    <div class="seed-detail">
      <img
        src="assets/nsic rc 222.jpg"
        alt="Seed photo"
        class="seed-detail-img"
        id="detail-img"
      >
      <div class="seed-detail-body">
        <h2 class="seed-detail-title" id="detail-title">Loading...</h2>
        <p class="seed-detail-desc" id="detail-desc"></p>
        <div class="seed-detail-badges" id="detail-badges"></div>
      </div>
    </div>

    <div style="margin-top: 2rem;">
      <button class="btn btn-secondary" onclick="history.back()">&#8592; Back</button>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
